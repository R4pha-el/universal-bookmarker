name: iOS and core checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Test portable core
        run: swift test --package-path Packages/BookmarkCore
      - name: Test cloud transport
        run: swift test --package-path Packages/BookmarkCloud
      - name: Check generated project
        run: |
          python3 scripts/generate_project.py
          git diff --exit-code -- ios/UniversalBookmarker.xcodeproj
      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild -project ios/UniversalBookmarker.xcodeproj -scheme UniversalBookmarker -destination 'generic/platform=iOS Simulator' -configuration Debug CODE_SIGNING_ALLOWED=NO build 2>&1 | tee native-build.log
      - name: Choose an available iPhone simulator
        run: |
          xcrun simctl list devices available --json > /tmp/devices.json
          python3 - <<'PY'
          import json, os
          devices=json.load(open('/tmp/devices.json'))['devices']
          phones=[d for runtime, group in devices.items() if 'iOS' in runtime for d in group if d.get('isAvailable') and 'iPhone' in d['name']]
          assert phones, 'No iPhone simulator is installed'
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('SIMULATOR_ID='+phones[0]['udid']+'\n')
          PY
      - name: Native tests
        run: |
          set -o pipefail
          xcodebuild -project ios/UniversalBookmarker.xcodeproj -scheme UniversalBookmarker -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO test 2>&1 | tee native-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-test-results
          path: |
            TestResults.xcresult
            native-build.log
            native-tests.log
          if-no-files-found: ignore
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: supabase/tests/package-lock.json
      - run: npm ci
        working-directory: supabase/tests
      - run: npm test
        working-directory: supabase/tests
